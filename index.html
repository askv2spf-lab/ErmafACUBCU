const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nodeName=k=>(typeof N!=='undefined'&&N[k]?N[k][0]:k);
const fmtCode=(id,m)=>m==='ACU'?id[0]+'.'+id.slice(1):'LED '+id.split('').join(' + ');
function ov(html){const o=document.createElement('div');o.className='v36-ov';o.innerHTML=`<div class="v36-box"><button class="v36-x" aria-label="Закрити">✕</button>${html}</div>`;o.addEventListener('click',e=>{if(e.target===o||e.target.classList.contains('v36-x')){o.remove();if(o._close)o._close()}});document.body.appendChild(o);return o}

/* ---------- 1. Довідник кодів помилок ---------- */
function openRef(){
  let mode=(typeof M!=='undefined'?M:'ACU');
  const o=ov(`<h2>Довідник кодів помилок</h2><div class="v36-mut">Пошук лише за кодом: F1, A.3, C9, 45… Симптом і назва вузла у фільтрі не враховуються. Дані з інструкцій GP 70.</div>
  <input class="v36-in" placeholder="Код: F.1, A.3, C9, 45…" autofocus>
  <div class="v36-tabs"><button data-m="ACU">ACU (індикатор)</button><button data-m="BCU">BCU (світлодіоди)</button></div><div class="v36-mut cnt"></div><div class="list"></div>`);
  const inp=o.querySelector('input'),list=o.querySelector('.list'),cnt=o.querySelector('.cnt');
  const draw=()=>{
    o.querySelectorAll('.v36-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    const q=inp.value.trim().toLowerCase().replace(/[.\s]/g,''),qr=inp.value.trim().toLowerCase();
    const src=(mode==='ACU'?A:B)||[];
    const hit=src.filter(f=>{if(!q)return true;return String(f.id).toLowerCase().replace(/[.\s]/g,'').includes(q)});
    const mark=t=>{t=esc(t);if(!qr||qr.length<2)return t;return t.replace(new RegExp(qr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<span class="v36-hl">${m}</span>`)};
    cnt.textContent=`Знайдено: ${hit.length} з ${src.length}`;
    list.innerHTML=hit.map(f=>`<div class="v36-code"><b class="c">${esc(fmtCode(f.id,mode))}</b><b>${mark(f.t)}</b><ul>${f.s.map(s=>`<li><span class="v36-mut">${esc(nodeName(s[0]))}:</span> ${mark(s[1])}</li>`).join('')}</ul></div>`).join('')||'<p class="v36-mut">Нічого не знайдено.</p>';
  };
  inp.oninput=draw;o.querySelectorAll('.v36-tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});draw();setTimeout(()=>inp.focus(),50);
}

(function(){

const ORIG=new WeakMap();let editing=false;
const roots=()=>[document.querySelector('header'),document.querySelector('#app')].filter(Boolean);
function walk(fn){roots().forEach(r=>{const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);let n;const a=[];while(n=w.nextNode())a.push(n);a.forEach(fn)})}
function applyEdits(){if(editing)return;walk(n=>{const v=n.nodeValue,k=ORIG.has(n)?ORIG.get(n):v;if(EDITS[k]!==undefined&&v!==EDITS[k]){n.nodeValue=EDITS[k];ORIG.set(n,k)}else if(!ORIG.has(n))ORIG.set(n,v)})}

function save(){try{localStorage.setItem(LS,JSON.stringify(EDITS))}catch(e){}}
document.addEventListener('input',e=>{if(!editing)return;const n=getSelection().anchorNode;if(!n||n.nodeType!=3)return;const o=ORIG.get(n);if(o===undefined)return;if(n.nodeValue===o)delete EDITS[o];else EDITS[o]=n.nodeValue;save()});
function setEdit(on){editing=on;localStorage.setItem(LM,on?'1':'');if(on)tag();roots().forEach(r=>r.contentEditable=on?'true':'false');document.body.classList.toggle('editmode',on);if(!on)applyEdits()}

const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src],{type:'text/html'}));a.download='index.html';a.click()}

document.body.appendChild(o);const q=s=>o.querySelector(s);q('#ed40').onchange=e=>setEdit(e.target.checked);q('#sv40').onclick=()=>{save();alert('Збережено в кеш браузера')};q('#dl40').onclick=dl;q('#rs40').onclick=()=>{if(confirm('Скинути всі правки?')){EDITS={};save();location.reload()}};q('#cl40').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()}}
const b=document.querySelector('header b');if(b&&b.firstChild){const t=b.firstChild.nodeValue,i=t.indexOf('🔥');if(i>=0){b.firstChild.nodeValue=t.slice(i+2);const s=document.createElement('span');s.textContent='🔥';s.style.cursor='pointer';s.title='Налаштування';s.onclick=e=>{e.stopPropagation();openSet()};b.insertBefore(s,b.firstChild)}}
